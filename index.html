<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <meta name="theme-color" content="#f5f3ef" />
    <meta
      name="description"
      content="NOTYP MGMT — premium artist management for crossover dance & pop."
    />
    <style>
      html {
        color-scheme: light;
        background: #f5f3ef;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f5f3ef;
        color: #111111;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" href="/brand/notype-seal.svg" type="image/svg+xml" />
    <title>NOTYP MGMT</title>
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme = 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <p style="margin:0;padding:2rem;font-family:system-ui,sans-serif;letter-spacing:0.08em">
        NOTYP MGMT
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
