<!doctype html>
<html lang="nl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta
      name="description"
      content="NOTYP MGMT — premium artist management for crossover dance & pop."
    />
    <style>
      html[data-theme='dark'] {
        background: #090909;
      }
      html[data-theme='light'] {
        background: #f5f3ef;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <link rel="preload" as="image" href="/brand/notype-seal.svg" type="image/svg+xml" />
    <title>NOTYP MGMT</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('notype-theme')
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <p style="margin:0;padding:2rem;font-family:system-ui,sans-serif;letter-spacing:0.08em">
        NOTYP MGMT
      </p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
