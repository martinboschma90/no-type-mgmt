<!doctype html>
<html lang="nl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta
      name="description"
      content="NOTYP MGMT — premium artist management for crossover dance & pop."
    />
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #090909;
        color: #f5f5f5;
      }
      html[data-theme='light'] {
        background: #f5f3ef;
        color: #111111;
      }
      #root { min-height: 100vh; }
      .boot {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 1.5rem 1rem 2rem;
        font-family: system-ui, sans-serif;
      }
      .boot img {
        display: block;
        height: clamp(2.75rem, 7vw, 5.25rem);
        width: auto;
      }
    </style>
    <link rel="preload" as="image" href="/brand/notype-wordmark.svg" type="image/svg+xml" />
    <title>NOTYP MGMT</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('notype-theme')
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <img src="/brand/notype-wordmark.svg" alt="NOTYP MGMT" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
